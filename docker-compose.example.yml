# Reference stack: Minecraft server + automatic backups.
# Start it first, then deploy MC Manager with docker-compose.yml.
services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports: ["25565:25565"]
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      # Modded server managed from the Mods page (see README, "Mods"):
      # TYPE: "FABRIC"
      # MODRINTH_PROJECTS: "@/data/mc-manager/modrinth-projects.txt"
      MEMORY: "4G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "change-me"
    volumes: ["mc-data:/data"]
    networks: [mc-network]
  mc-backup:
    image: itzg/mc-backup:latest
    container_name: mc-backup
    # Same UID as the MC Manager backend (node, 1000) so it can delete archives.
    user: "1000:1000"
    restart: unless-stopped
    depends_on: { mc: { condition: service_healthy } }
    # Reads the interval and retention set from the Backups page (see README, "Backup schedule").
    entrypoint:
      - /bin/bash
      - -c
      - |
        f=/backups/.mc-manager/backup-settings.conf
        if [ -r "$$f" ]; then
          while IFS='=' read -r k v; do
            case "$$k" in
              BACKUP_INTERVAL) [[ "$$v" =~ ^[1-9][0-9]*[mhd]$$ ]] && export BACKUP_INTERVAL="$$v" ;;
              PRUNE_BACKUPS_DAYS) [[ "$$v" =~ ^[1-9][0-9]*$$ ]] && export PRUNE_BACKUPS_DAYS="$$v" ;;
            esac
          done < "$$f"
        fi
        exec /usr/bin/backup loop
    environment:
      BACKUP_METHOD: tar
      # Fallbacks until a schedule is set from the Backups page.
      BACKUP_INTERVAL: "2h"
      PRUNE_BACKUPS_DAYS: "7"
      RCON_HOST: mc
      RCON_PASSWORD: "change-me"
      INITIAL_DELAY: "2m"
    volumes: ["mc-data:/data:ro", "mc-backups:/backups"]
    networks: [mc-network]
volumes:
  # Fixed names so that MC_DATA_VOLUME=mc-data and MC_BACKUPS_VOLUME=mc-backups
  # match whatever the compose project name is.
  mc-data:
    name: mc-data
  mc-backups:
    name: mc-backups
networks:
  mc-network:
    name: mc-network
